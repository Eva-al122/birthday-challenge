const mel=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]];
function tone(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function playLoop(){if(!musicOn)return;let t=ac.currentTime+.05;mel.forEach(([n,b])=>{tone(F[n],t,b*BEAT*.95,'triangle',.18);tone(F[n]/2,t,b*BEAT*.9,'sine',.08);t+=b*BEAT});setTimeout(playLoop,(t-ac.currentTime)*1000+500)}
function startMusic(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=muted?0:1;mg.connect(ac.destination)}ac.resume();if(!musicOn){musicOn=true;playLoop()}}catch(e){}}
function sfx(bad){try{if(!ac)return;const t=ac.currentTime;if(bad){tone(150,t,.25,'sawtooth',.25);tone(90,t+.08,.3,'sawtooth',.25)}else{tone(880,t,.12,'square',.12);tone(1320,t+.08,.18,'square',.12)}}catch(e){}}
function fanfare(){try{if(!ac)return;const t=ac.currentTime;[F.C5,F.E5,F.G5,F.C6,F.G5,F.C6].forEach((f,i)=>tone(f,t+i*.14,.4,'triangle',.25))}catch(e){}}
document.getElementById('mu').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊';if(mg)mg.gain.value=muted?0:1};
function reset(){score=0;items=[];conf=[];sc.textContent=0;px=W/2;won=false}
function startGame(){startMusic();name=document.getElementById('nm').value.trim()||'壽星';reset();document.getElementById('start').classList.remove('show');document.getElementById('win').classList.remove('show');run=true;last=performance.now();requestAnimationFrame(loop)}
document.getElementById('go').onclick=startGame;
document.getElementById('again').onclick=()=>{document.getElementById('win').classList.remove('show');reset();run=true;last=performance.now();requestAnimationFrame(loop)};
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key]=0);
function setX(cx){const r=cv.getBoundingClientRect();px=Math.max(R,Math.min(W-R,(cx-r.left)/r.width*W))}
cv.addEventListener('pointermove',e=>setX(e.clientX));
cv.addEventListener('pointerdown',e=>setX(e.clientX));
function loop(t){if(!run)return;const dt=Math.min(.05,(t-last)/1000);last=t;
 if(keys.ArrowLeft||keys.a)px-=380*dt;if(keys.ArrowRight||keys.d)px+=380*dt;px=Math.max(R,Math.min(W-R,px));
 spawn-=dt;if(spawn<=0){spawn=.38+Math.random()*.3;const bm=cakeRun>=2||Math.random()<(cakeRun?.4:.25);cakeRun=bm?0:cakeRun+1;const bx=40+Math.random()*(W-80);items.push({x:bx,bx,ph:Math.random()*6.28,amp:bm?20+Math.random()*25:0,y:-20,v:170+Math.random()*130+score*14,bomb:bm})}
 const py=H-R-12;
 items.forEach(i=>{i.y+=i.v*dt;if(i.amp)i.x=Math.max(20,Math.min(W-20,i.bx+Math.sin(i.y/45+i.ph)*i.amp))});
 items=items.filter(i=>{if(Math.hypot(i.x-px,i.y-py)<R+14){if(i.bomb){sfx(1);score=Math.max(0,score-2);for(let k=0;k<10;k++)conf.push({x:i.x,y:i.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,l:.5,c:'#555'})}else{sfx(0);score++;for(let k=0;k<10;k++)conf.push({x:i.x,y:i.y,vx:(Math.random()-.5)*240,vy:-Math.random()*200,l:.8,c:'hsl('+Math.random()*360+',90%,60%)'})}sc.textContent=score;return false}return i.y<H+30});
 conf.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt});conf=conf.filter(p=>p.l>0);
 ctx.clearRect(0,0,W,H);ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';
 items.forEach(i=>ctx.fillText(i.bomb?'💣':'🎂',i.x,i.y));
 conf.forEach(p=>{ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,6,6)});
 ctx.save();ctx.beginPath();ctx.arc(px,py,R,0,7);ctx.clip();
 if(face.complete&&face.naturalWidth)ctx.drawImage(face,px-R,py-R,R*2,R*2);else{ctx.fillStyle='#ffb3d1';ctx.fill()}
 ctx.restore();ctx.lineWidth=4;ctx.strokeStyle='#ff6fa5';ctx.beginPath();ctx.arc(px,py,R,0,7);ctx.stroke();
 ctx.font='26px serif';ctx.fillText('🎉',px,py-R-8);
 if(score>=10&&!won){won=true;run=false;fanfare();document.getElementById('msg').textContent='生日快樂！'+name+'，這是送你的專屬禮物！';document.getElementById('win').classList.add('show');return}
 requestAnimationFrame(loop)}
</script></body></html>
